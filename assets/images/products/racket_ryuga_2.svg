<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <circle cx="250" cy="190" r="140" fill="#ef4444" opacity="0.14" filter="url(#glow)"/>

  <g transform="translate(40, 40)">
    <rect width="130" height="32" rx="16" fill="#7c3aed" opacity="0.25"/>
    <text x="65" y="21" fill="#c4b5fd" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">VICTOR POWER</text>
  </g>

  <g transform="translate(340, 40)">
    <rect width="120" height="32" rx="16" fill="#ef4444" opacity="0.25"/>
    <text x="60" y="21" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">4U / 31 LBS</text>
  </g>

  <g id="racket">
    <g stroke="#94a3b8" stroke-width="1.2" opacity="0.38">
      <line x1="225" y1="90" x2="225" y2="255" />
      <line x1="235" y1="85" x2="235" y2="260" />
      <line x1="245" y1="82" x2="245" y2="263" />
      <line x1="255" y1="82" x2="255" y2="263" />
      <line x1="265" y1="85" x2="265" y2="260" />
      <line x1="275" y1="90" x2="275" y2="255" />
      <line x1="210" y1="120" x2="290" y2="120" />
      <line x1="205" y1="140" x2="295" y2="140" />
      <line x1="200" y1="160" x2="300" y2="160" />
      <line x1="200" y1="180" x2="300" y2="180" />
      <line x1="202" y1="200" x2="298" y2="200" />
      <line x1="205" y1="220" x2="295" y2="220" />
      <line x1="212" y1="240" x2="288" y2="240" />
    </g>

    <ellipse cx="250" cy="175" rx="60" ry="90" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="250" cy="175" rx="55" ry="85" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.7"/>

    <path d="M 240 262 Q 250 272 260 262 L 256 280 L 244 280 Z" fill="#8b5cf6" />
    <rect x="246" y="278" width="8" height="120" rx="3" fill="url(#shaftGrad)"/>
    <rect x="246" y="310" width="8" height="6" fill="#ef4444"/>
    <rect x="246" y="350" width="8" height="6" fill="#a855f7"/>

    <polygon points="244,398 256,398 259,412 241,412" fill="#7c3aed"/>
    <rect x="242" y="412" width="16" height="70" rx="3" fill="#1e1b4b" stroke="#334155" stroke-width="1"/>
    <line x1="242" y1="425" x2="258" y2="430" stroke="#ef4444" stroke-width="2"/>
    <line x1="242" y1="440" x2="258" y2="445" stroke="#a855f7" stroke-width="2"/>
    <line x1="242" y1="455" x2="258" y2="460" stroke="#ef4444" stroke-width="2"/>
    <line x1="242" y1="470" x2="258" y2="475" stroke="#a855f7" stroke-width="2"/>
    <rect x="240" y="480" width="20" height="8" rx="2" fill="#ef4444"/>
  </g>

  <g transform="translate(370, 370) scale(0.65)" opacity="0.85">
    <polygon points="50,20 20,70 80,70" fill="#f8fafc" opacity="0.8"/>
    <circle cx="50" cy="80" r="16" fill="#e2e8f0"/>
    <path d="M 25 65 Q 50 72 75 65" stroke="#ef4444" stroke-width="4" fill="none"/>
  </g>

  <text x="250" y="465" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="17" text-anchor="middle" letter-spacing="0.8">THRUSTER RYUGA II</text>
</svg>